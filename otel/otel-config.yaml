receivers:

  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu:
      memory:
      disk:
      filesystem:
      load:
      network:

processors:

  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:

  debug:
    verbosity: normal

service:

  pipelines:

    metrics:
      receivers:
        - hostmetrics
      processors:
        - batch
      exporters:
        - debug
